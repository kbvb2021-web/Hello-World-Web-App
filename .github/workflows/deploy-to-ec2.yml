# Build and deploy to EC2 — improved
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (build output)
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - name: Prepare SSH key
        # create a temporary ssh key file from the secret
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy JAR to EC2 via scp
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          PORT="${EC2_PORT:-22}"
          TARGET_DIR="${EC2_TARGET_DIR:-/home/${{ secrets.EC2_USER }}/app}"
          mkdir -p "$(dirname target/placeholder)" || true
          # scp the JAR file(s). downloaded artifact placed in ./target/
          scp -o StrictHostKeyChecking=no -P "$PORT" ./target/*.jar "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$TARGET_DIR/"

      - name: Install Java if needed and start app on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -e
          PORT="${EC2_PORT:-22}"
          TARGET_DIR="${EC2_TARGET_DIR:-/home/${{ secrets.EC2_USER }}/app}"
          # Run remote installer + launcher via ssh. Use the temporary key file created above.
          ssh -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_rsa "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOF'
            set -e
            TARGET_DIR='"'"$TARGET_DIR"'"'
            mkdir -p "$TARGET_DIR"
            # Install Java if missing (Debian/Ubuntu and RHEL/AMZN)
            if ! command -v java >/dev/null 2>&1; then
              if [ -f /etc/debian_version ]; then
                sudo apt-get update
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-11-jre-headless
              else
                sudo yum install -y java-11-amazon-corretto-headless || sudo yum install -y java-11-openjdk
              fi
            fi
            # Gracefully stop previously running instance (best-effort)
            pkill -f 'helloworld' || true
            # Ensure the JAR exists and set permissions
            JAR=$(ls -1 "$TARGET_DIR"/*.jar 2>/dev/null | tail -n1 || true)
            if [ -z "$JAR" ]; then
              echo "No JAR found in $TARGET_DIR" >&2
              exit 2
            fi
            chmod 644 "$JAR"
            # Launch in background (consider replacing this with a systemd service for production)
            nohup java -jar "$JAR" > "$TARGET_DIR/helloworld.log" 2>&1 &
            echo "App started with JAR: $JAR"
          EOF
