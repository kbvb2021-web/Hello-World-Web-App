# Build and deploy to EC2 — fixed deploy job
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (build output)
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Verify artifact present locally
        run: |
          echo "Local target contents:"
          ls -la target || true
          JAR_COUNT=$(ls -1 target/*.jar 2>/dev/null | wc -l || true)
          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No JAR found in ./target — aborting" >&2
            exit 1
          fi

      - name: Ensure target dir exists on EC2 and copy JAR
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -euo pipefail
          EC2_HOST="${EC2_HOST:?}"
          EC2_USER="${EC2_USER:?}"
          PORT="${EC2_PORT:-22}"
          TARGET_DIR="${EC2_TARGET_DIR}"

          echo "Creating remote directory: $TARGET_DIR"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p "$PORT" "${EC2_USER}@${EC2_HOST}" "mkdir -p '$TARGET_DIR' && chmod 755 '$TARGET_DIR'"

          echo "Copying JAR(s) to ${EC2_USER}@${EC2_HOST}:$TARGET_DIR"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -P "$PORT" ./target/*.jar "${EC2_USER}@${EC2_HOST}:'$TARGET_DIR/'"

      - name: Install Java if needed and start app on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_TARGET_DIR: ${{ secrets.EC2_TARGET_DIR }}
        run: |
          set -euo pipefail
          EC2_HOST="${EC2_HOST:?}"
          EC2_USER="${EC2_USER:?}"
          PORT="${EC2_PORT:-22}"
          TARGET_DIR="${EC2_TARGET_DIR:-/home/${EC2_USER}/app}"

          # Run remote script, passing TARGET_DIR into the remote environment by prefixing the remote command.
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p "$PORT" "${EC2_USER}@${EC2_HOST}" "TARGET_DIR='$TARGET_DIR' bash -s" <<'EOF'
          set -euo pipefail
          echo "Remote target dir: $TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          # Install Java if missing (Debian/Ubuntu and RHEL/AMZN)
          if ! command -v java >/dev/null 2>&1; then
            if [ -f /etc/debian_version ]; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-11-jre-headless
            else
              sudo yum install -y java-11-amazon-corretto-headless || sudo yum install -y java-11-openjdk
            fi
          fi
          # Stop previously running instance (best-effort)
          pkill -f 'helloworld' || true

          # Find the JAR in the target dir
          JAR=$(ls -1 "$TARGET_DIR"/*.jar 2>/dev/null | tail -n1 || true)
          if [ -z "$JAR" ]; then
            echo "No JAR found in \"$TARGET_DIR\"" >&2
            exit 2
          fi
          chmod 644 "$JAR"
          nohup java -jar "$JAR" > "$TARGET_DIR/helloworld.log" 2>&1 &
          echo "App started with JAR: $JAR"
          EOF
