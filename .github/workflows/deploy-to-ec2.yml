name: Build and deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar-path: ${{ steps.build.outputs.jar-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build with Maven
        id: build
        run: mvn -B package -DskipTests
      - name: Set jar path output
        run: echo "::set-output name=jar-path::target/helloworld-1.0-SNAPSHOT.jar"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Upload artifact (build output)
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: /homne
        # If not using artifacts: fetch directly from workspace target path by repeating the build or using actions/checkout.
        
      - name: Verify downloaded artifact
        run: |
          echo "Downloaded files:"
          echo "EC2 Host: ${{ secrets.EC2_HOST }}"
          find . -type f -print
          echo "Artifact directory:"
          pwd
          ls -la /home
      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          source: target/helloworld-1.0-SNAPSHOT.jar
          target: ${{ secrets.EC2_TARGET_DIR || format('/home/{0}/app', secrets.EC2_USER) }}
      - name: Install Java if needed and start app on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script: |
            set -e
            target: ${{ secrets.EC2_TARGET_DIR || format('/home/{0}/app', secrets.EC2_USER) }}
            mkdir -p "$TARGET_DIR"
            # Install Java if missing (supports Debian/Ubuntu and RHEL/AMZN)
            if ! command -v java >/dev/null 2>&1; then
              if [ -f /etc/debian_version ]; then
                sudo apt-get update
                sudo apt-get install -y openjdk-11-jre-headless
              else
                # Amazon Linux / RHEL variants
                sudo yum install -y java-11-amazon-corretto-headless || sudo yum install -y java-11-openjdk
              fi
            fi
            # stop previously running instance (best-effort)
            pkill -f 'helloworld' || true
            # move jar into target dir (the scp action already places it there)
            nohup java -jar "$TARGET_DIR/helloworld-1.0-SNAPSHOT.jar" > "$TARGET_DIR/helloworld.log" 2>&1 &
